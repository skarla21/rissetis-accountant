<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <title>Ρισσέτης — Google Review Stand</title>
  <style>
@page { size: 100mm 150mm; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100mm;
  height: 150mm;
  overflow: hidden;
  background: #fff;
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color: #1a1a1a;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.stand {
  width: 100mm;
  height: 150mm;
  padding: 8mm 0 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  background: #fff;
  overflow: hidden;
}
.stand-inner {
  width: 100%;
  padding: 0 7mm;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1 1 auto;
  min-height: 0;
}
.top-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  justify-content: flex-start;
  padding-top: 1mm;
}
.stand-inner .actions {
  margin-top: auto;
}
.brand-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  gap: 3.2mm;
}
.headline {
  text-align: center;
  font-size: 5.2mm;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
  margin-bottom: 5.5mm;
  width: 100%;
}
.google-g { width: 18mm; height: 18mm; display: block; flex-shrink: 0; }
.stars { width: 32mm; height: 5.8mm; display: block; flex-shrink: 0; }
.qr-wrap {
  position: relative;
  width: 52mm;
  height: 52mm;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.qr-wrap img { width: 44mm; height: 44mm; display: block; }
.corner {
  position: absolute;
  width: 7mm;
  height: 7mm;
  border: 2.2px solid #111;
}
.corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
.corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
.corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
.corner.br { bottom: 0; right: 0; border-left: none; border-top: none; }
.actions {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 5mm;
  width: 100%;
  padding: 4mm 0 5mm;
  flex: 0 0 auto;
}
.action {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 34mm;
  text-align: center;
  position: relative;
}
.action-label { font-size: 3.4mm; font-weight: 600; margin-bottom: 1.5mm; }
.or { align-self: center; font-size: 3.4mm; color: #555; padding-top: 9mm; }
.nfc-mark {
  width: 28mm;
  height: 28mm;
  border-radius: 50%;
  border: 1.8px dashed #4285F4;
  background: rgba(66,133,244,0.04);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.nfc-hint {
  margin-top: 1.5mm;
  white-space: nowrap;
  font-size: 2mm;
  color: #4285F4;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1;
}
.scan-mark {
  width: 28mm;
  height: 28mm;
  display: flex;
  align-items: center;
  justify-content: center;
}
.action-icon { width: 18mm; height: 18mm; }
.footer-stripe {
  width: 100%;
  height: 4mm;
  display: flex;
  flex: 0 0 auto;
  margin-top: auto;
  align-self: stretch;
}
.footer-stripe span { flex: 1; }
.footer-stripe .b { background: #4285F4; }
.footer-stripe .g { background: #34A853; }
.footer-stripe .y { background: #FBBC05; }
.footer-stripe .r { background: #EA4335; }
</style>
</head>
