<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <title>Ρισσέτης — Google Review Stand</title>
  <style>
@page { size: 100mm 150mm; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100mm;
  height: 150mm;
  overflow: hidden;
  background: #fff;
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color: #1a1a1a;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.stand {
  width: 100mm;
  height: 150mm;
  padding: 5mm 0 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  background: #fff;
  overflow: hidden;
}
.stand-inner {
  width: 100%;
  padding: 0 7mm;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1 1 auto;
  min-height: 0;
}
.top-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  flex: 0 0 auto;
  justify-content: flex-start;
  padding-top: 1mm;
}
.stand-inner .footer-spacer {
  flex: 1 1 auto;
  min-height: 2mm;
}
.firm-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.4mm;
  margin-bottom: 3mm;
  width: 100%;
  flex-shrink: 0;
}
.firm-logo {
  width: 12mm;
  height: 12mm;
  display: block;
  object-fit: contain;
}
.firm-name {
  text-align: center;
  font-size: 3.4mm;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #1A6FB5;
  line-height: 1.15;
}
.firm-tagline {
  text-align: center;
  font-size: 2mm;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #4AA8B5;
  line-height: 1;
  margin-top: -0.2mm;
}
.brand-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
  gap: 3.5mm;
}
.headline {
  text-align: center;
  font-size: 4.6mm;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
  margin-bottom: 3mm;
  width: 100%;
}
.google-row {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 2.5mm;
  flex-shrink: 0;
  overflow: visible;
  padding: 0.8mm 0;
}
.google-g {
  width: 11mm;
  height: 11mm;
  display: block;
  flex-shrink: 0;
  overflow: visible;
}
.stars { width: 30mm; height: 5.2mm; display: block; flex-shrink: 0; }
.qr-wrap {
  position: relative;
  width: 50mm;
  height: 50mm;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.qr-wrap img { width: 42mm; height: 42mm; display: block; }
.corner {
  position: absolute;
  width: 7mm;
  height: 7mm;
  border: 2.2px solid #111;
}
.corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
.corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
.corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
.corner.br { bottom: 0; right: 0; border-left: none; border-top: none; }
.actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6mm;
  width: 100%;
  padding: 4mm 0 5mm;
  flex: 0 0 auto;
}
.action {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 32mm;
  text-align: center;
  position: relative;
}
.or {
  align-self: center;
  font-size: 3.6mm;
  color: #555;
  padding-top: 0;
}
.nfc-mark {
  width: 26mm;
  height: 26mm;
  border-radius: 50%;
  border: 1.8px dashed #4285F4;
  background: rgba(66,133,244,0.04);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.action-hint {
  margin-top: 1.8mm;
  white-space: nowrap;
  font-size: 2mm;
  color: #4285F4;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1;
}
.scan-mark {
  width: 26mm;
  height: 26mm;
  display: flex;
  align-items: center;
  justify-content: center;
}
.action-icon { width: 16mm; height: 16mm; }
.footer-stripe {
  width: 100%;
  height: 4mm;
  display: flex;
  flex: 0 0 auto;
  margin-top: auto;
  align-self: stretch;
}
.footer-stripe span { flex: 1; }
.footer-stripe .b { background: #4285F4; }
.footer-stripe .g { background: #34A853; }
.footer-stripe .y { background: #FBBC05; }
.footer-stripe .r { background: #EA4335; }
</style>
</head>
